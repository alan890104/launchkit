services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit
      POSTGRES_DB: launchkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchkit"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
